name: Monthly Trend Report

on:
  schedule:
    # 1st of every month, 08:00 UTC
    - cron: "0 8 1 * *"
  workflow_dispatch: {}

jobs:
  trends:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run trend report
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
        run: python trend_report.py

      - name: Commit report to repo
        run: |
          git config user.name "research-agent-bot"
          git config user.email "actions@github.com"
          git add output/ || true
          git diff --staged --quiet && echo "Nothing to commit" && exit 0
          git commit -m "Add trend report $(date +'%Y-%m-%d')"
          git pull --rebase origin main
          git push
